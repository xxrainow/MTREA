# Held-out: most kinematically dissimilar to pick_place — hinge/joint
# interaction vs. free object manipulation. Expected hardest retention case.
name: open_drawer
instruction_template: "open the {object} by pulling its {target}"
success_condition: "the {object} is opened past its halfway point via the {target} handle"
target_eval_trials: 30
role: held_out
