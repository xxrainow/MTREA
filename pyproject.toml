[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt-rea"
version = "0.0.0"
description = "MT-REA — does narrow fine-tuning of a pretrained VLA on a new embodiment preserve held-out capability?"
readme = "README.md"
requires-python = ">=3.12"
# LeRobot is pinned to v0.6.1 (which requires Python 3.12) and is not resolved
# here: install lerobot[pi,async,training] on the GPU host and lerobot[feetech]
# on the robot side. See AGENTS.md "Tech stack". Package manager (uv vs pip) TODO.
dependencies = [
    "torch",
    "psutil",
    "PyYAML",
]

[project.optional-dependencies]
server = [
    "fastapi",
    "uvicorn",
]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lab*", "research*", "robot*"]

[tool.pytest.ini_options]
testpaths = ["research", "tests"]
